name: buku_pupuk
description: Buku Pupuk BUMDes Desa Kabat, Flutter dan Firebase.
publish_to: none
version: 2.1.0+21
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  firebase_database: ^12.0.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  uuid: ^4.5.1
  pdf: ^3.11.3
  printing: ^5.14.2
  excel: ^4.0.6
  file_selector: ^1.0.3
  local_auth: ^2.3.0
  share_plus: ^11.1.0
  path_provider: ^2.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/DejaVuSans-Bold.ttf
